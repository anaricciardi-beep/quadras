
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gerenciamento de Quadras{% endblock %}</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f3f6f4;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Menu superior */
        .navbar {
            background-color: #10291e !important;
            padding: 18px 25px;
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: bold;
            margin-right: 25px;
        }

        .navbar .nav-link {
            color: white !important;
            margin-right: 12px;
            font-size: 15px;
        }

        .navbar .nav-link:hover {
            color: #d7e8dc !important;
        }

        .menu-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        /* Títulos verdes */
        .text-success {
            color: #10291e !important;
        }

        /* Botões principais */
        .btn-success {
            background-color: #10291e !important;
            border-color: #10291e !important;
        }

        .btn-success:hover {
            background-color: #1d4936 !important;
            border-color: #1d4936 !important;
        }

        /* Botões com borda */
        .btn-outline-success {
            color: #10291e !important;
            border-color: #10291e !important;
        }

        .btn-outline-success:hover {
            background-color: #10291e !important;
            color: white !important;
        }

        /* Cartões */
        .card {
            border-radius: 8px;
        }

        /* Links comuns */
        a {
            color: #10291e;
        }

        a:hover {
            color: #1d4936;
        }

        /* Ajustes para telas pequenas */
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .navbar .nav-link {
                font-size: 14px;
                padding: 7px;
            }
        }
    </style>

</head>

<body>

    <!-- Menu superior -->
    <nav class="navbar navbar-dark d-flex flex-wrap align-items-center">

        <a class="navbar-brand" href="{% url 'index' %}">
            Quadras Esportivas
        </a>

        <div class="menu-links">

            <a class="nav-link" href="{% url 'index' %}">
                Início
            </a>

            {% if user.is_authenticated and user.is_active and user.is_staff %}

                <a class="nav-link" href="{% url 'clientes' %}">
                    Clientes
                </a>

                <a class="nav-link" href="{% url 'reservas' %}">
                    Reservas
                </a>

                <a class="nav-link" href="{% url 'quadras' %}">
                    Quadras
                </a>

                <a class="nav-link" href="{% url 'horarios' %}">
                    Horários
                </a>

                <a class="nav-link" href="{% url 'complexos' %}">
                    Complexos
                </a>

                <a class="nav-link" href="{% url 'modalidades' %}">
                    Modalidades
                </a>

                <a class="nav-link" href="{% url 'admin:index' %}">
                    Administração
                </a>

            {% else %}

                <a class="nav-link" href="{% url 'admin:login' %}">
                    Entrar
                </a>

            {% endif %}

        </div>

    </nav>

    <!-- Conteúdo principal -->
    <main class="container mt-5 mb-5">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
